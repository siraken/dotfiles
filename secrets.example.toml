# Copy to secrets.toml. Read at activation time only, never during evaluation.
# Consumed by https://github.com/siraken/git-clients.nix

[[gitClients]]
# Directory holding the client's repositories, relative to ~/repos.
dir = "github.com/example-org"
# Gitconfig for those repositories, relative to ~/.config/git.custom.
# Maintained by hand, outside this repository.
configFile = "example-org"
# Optional: hosts whose stored credential must only be reachable from `dir`.
credentialHosts = ["https://git.example.com"]
# Optional: exported by a generated .envrc at the root of `dir`.
env.GITLAB_HOST = "git.example.com"
