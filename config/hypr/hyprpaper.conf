# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Started by autostart.lua.

splash = false

# The images live outside this public repo, in ~/Pictures/Wallpapers (the
# ones taken over from Omarchy's Tokyo Night theme); `current` links to one.
wallpaper {
    monitor =
    path = ~/Pictures/Wallpapers/current
    fit_mode = cover
}
