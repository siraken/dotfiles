# xdg-desktop-portal-hyprland, read from ~/.config/hypr/xdph.conf.
# See https://wiki.hypr.land/Hypr-Ecosystem/xdg-desktop-portal-hyprland/

screencopy {
    # Offer "remember this choice" in the picker, so an app that was allowed to
    # share the screen once can share it again without asking.
    allow_token_by_default = true
}
