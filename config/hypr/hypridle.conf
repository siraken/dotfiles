# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# Read by NixOS's hypridle user unit (nix/hosts/siraken-mba/desktop.nix).

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # Turn the screen back on after waking, before the lock screen draws.
    # With a Lua config, hyprctl dispatch takes a Lua dispatcher expression.
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# Dim the screen.
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# Keyboard backlight off.
listener {
    timeout = 150
    on-timeout = brightnessctl -sd smc::kbd_backlight set 0
    on-resume = brightnessctl -rd smc::kbd_backlight
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
