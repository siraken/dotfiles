# Launcher and menus for Hyprland on NixOS (siraken-mba). See fuzzel.ini(5).

[main]
font=JetBrainsMono Nerd Font:size=11
terminal=wezterm start --
launch-prefix=uwsm-app --
width=40
lines=12
horizontal-pad=16
vertical-pad=12

[colors]
background=1a1b26f2
text=c0caf5ff
prompt=33ccffff
input=c0caf5ff
match=00ff99ff
selection=33467cff
selection-text=c0caf5ff
selection-match=00ff99ff
border=33ccffee

[border]
width=2
radius=0
