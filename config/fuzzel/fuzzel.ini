# Launcher and menus for Hyprland on NixOS (siraken-mba). See fuzzel.ini(5).

[main]
# [colors], generated from nix/colors/tokyonight.nix.
include=~/.config/desktop-theme/fuzzel.ini
font=Hack Nerd Font:size=11
terminal=wezterm start --
launch-prefix=uwsm-app --
width=40
lines=12
horizontal-pad=16
vertical-pad=12

[border]
width=1
radius=8
