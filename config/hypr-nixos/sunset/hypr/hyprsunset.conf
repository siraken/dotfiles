# Night light on a schedule. hyprsunset has no --config: autostart.lua runs it
# with XDG_CONFIG_HOME pointing here, so Omarchy's ~/.config/hypr is not read.
# scripts/nightlight keeps the same times.
# See https://wiki.hypr.land/Hypr-Ecosystem/hyprsunset/

profile {
    time = 07:00
    identity = true
}

profile {
    time = 19:00
    temperature = 4000
}
