# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Started by hypridle (hypridle.conf) with -c. Tokyo Night, like the bar.

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The wallpaper (hyprpaper.conf), blurred and dimmed; plain Tokyo Night if
# the image is missing. Blurred once when the screen locks, so cheap enough
# for the HD 5000.
background {
    monitor =
    path = ~/.local/state/omarchy/current/background
    color = rgba(1a1b26ff)
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 72
    font_family = Hack Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(a9b1d6ff)
    font_size = 14
    font_family = Hack Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    outer_color = rgba(2f3549ff)
    inner_color = rgba(1a1b26e6)
    font_color = rgba(c0caf5ff)
    font_family = Hack Nerd Font
    check_color = rgba(7aa2f7ff)
    fail_color = rgba(f7768eff)
    capslock_color = rgba(e0af68ff)
    placeholder_text = <span foreground="##565f89">Password</span>
    fail_text = <i>$FAIL</i>
    dots_center = true
    fade_on_empty = false
    rounding = 8
    shadow_passes = 1
    position = 0, -20
    halign = center
    valign = center
}
