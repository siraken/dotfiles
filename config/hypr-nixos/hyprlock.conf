# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Started by hypridle (hypridle.conf) with -c.

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(1a1b26ff)
}

label {
    monitor =
    text = $TIME
    color = rgba(c0caf5ff)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 48
    outline_thickness = 2
    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    inner_color = rgba(1a1b26ff)
    font_color = rgba(c0caf5ff)
    check_color = rgba(e0af68ff)
    fail_color = rgba(f7768eff)
    placeholder_text = Password
    fade_on_empty = false
    rounding = 0
    position = 0, -20
    halign = center
    valign = center
}
