# See https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# Started by hypridle (hypridle.conf) with -c. Colours ($bg, $fg, …) are
# generated from nix/colors/tokyonight.nix (nix/programs/hyprland/colors.nix).

source = ~/.config/desktop-theme/colors.conf

general {
    hide_cursor = true
    ignore_empty_input = true
}

# The wallpaper (hyprpaper.conf), blurred and dimmed; plain Tokyo Night if
# the image is missing. Blurred once when the screen locks, so cheap enough
# for the HD 5000.
background {
    monitor =
    path = ~/.local/state/omarchy/current/background
    color = $bg
    blur_passes = 2
    blur_size = 6
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 72
    font_family = Hack Nerd Font Bold
    position = 0, 140
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $fgDark
    font_size = 14
    font_family = Hack Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 44
    outline_thickness = 1
    outer_color = $border
    inner_color = $bg
    font_color = $fg
    font_family = Hack Nerd Font
    check_color = $blue
    fail_color = $red
    capslock_color = $yellow
    # Pango markup takes no hyprlang variable: $muted, written out.
    placeholder_text = <span foreground="##565f89">Password</span>
    fail_text = <i>$FAIL</i>
    dots_center = true
    fade_on_empty = false
    rounding = 8
    shadow_passes = 1
    position = 0, -20
    halign = center
    valign = center
}
