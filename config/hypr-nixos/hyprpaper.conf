# See https://wiki.hypr.land/Hypr-Ecosystem/hyprpaper/
# Started by autostart.lua with -c, so ~/.config/hypr (Omarchy's) is not read.

splash = false

# The wallpaper Omarchy's theme picked, in the shared /home; no image goes in
# this public repo. Point this somewhere else once Omarchy is removed (#244).
wallpaper {
    monitor =
    path = ~/.local/state/omarchy/current/background
    fit_mode = cover
}
